name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(awk '/^\[project\]/{p=1;next} /^\[/{p=0} p&&/^[[:space:]]*version[[:space:]]*=/{gsub(/^[[:space:]]*version[[:space:]]*=[[:space:]]*"/,"");gsub(/".*$/,"");print;exit}' pyproject.toml)
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag != pyproject.toml $pkg"; exit 1; }

      - name: Extract release notes from CHANGELOG
        # Heading may be '## [X.Y.Z] - DATE' (this repo) or '## X.Y.Z (DATE)'.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
              $0 ~ "^## \\[?" ver "\\]?( |$|\\()" { grab=1; next }
              grab && /^## /                      { exit }
              grab                                { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          [ -s release-notes.md ] || { echo "::error::No CHANGELOG section for $version"; exit 1; }
          cat release-notes.md

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build package
        run: uv build

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: release-notes.md

  build-binary:
    name: Build standalone Linux binary
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install . pyinstaller

      - name: Build binary with PyInstaller
        run: |
          echo 'from jellyplex_sync.cli.main import main; main()' > _entry.py
          uv run pyinstaller --onefile --name jellyplex-linux-x86_64 _entry.py

      - name: Smoke-test the binary
        run: |
          ./dist/jellyplex-linux-x86_64 --help
          echo "Binary size: $(du -h dist/jellyplex-linux-x86_64 | cut -f1)"

      - name: Attach binary to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/jellyplex-linux-x86_64
