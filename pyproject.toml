[project]
name = "jellyplex-sync"
version = "0.3.4"
description = "Convert your media library between Jellyfin and Plex formats by creating a hard-linked mirror"
authors = [{ name = "Stefan Schönberger", email = "stefan@sniner.dev" }]
requires-python = ">=3.11"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["plex", "jellyfin", "media-library", "movies", "sync", "hardlink", "mirror"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sniner/jellyplex-sync"
Repository = "https://github.com/sniner/jellyplex-sync"
Issues = "https://github.com/sniner/jellyplex-sync/issues"
Changelog = "https://github.com/sniner/jellyplex-sync/blob/main/CHANGELOG.md"

[project.scripts]
jellyplex = "jellyplex_sync.cli.main:main"
jellyplex-sync = "jellyplex_sync.cli.sync:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "jellyplex-gen>=0.1.0",
    "ruff>=0.15.5,<0.16",
    "basedpyright>=1.38.2,<2",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
venvPath = "."
venv = ".venv"

# Tests stay at standard-level strictness: annotating every pytest
# fixture parameter adds noise, not safety. The library itself is
# checked strict.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportMissingTypeArgument = false
reportPrivateUsage = false
reportUnusedCallResult = false
reportMissingTypeStubs = false

[tool.ruff]
line-length = 96

[tool.ruff.lint]
ignore = ["E402"]
per-file-ignores = { "__init__.py" = ["F401"] }
extend-select = [
    "I",   # isort
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "B",   # flake8-bugbear
]
